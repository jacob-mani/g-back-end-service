plugins {
	id 'java'
	id 'maven-publish'
	id 'org.springframework.boot' version '3.3.10'
	id 'gradle-boost' version '5.3.0'
	id 'org.sonarqube' version '5.1.0.4882'
	id 'jacoco'
	id 'com.google.cloud.tools.jib' version '3.4.4'
	//id 'com.ford.it.gradle.plugin.FordGradlePlugins' version '1.2.1'
}

group = 'com.ford.grid'
version = gradleBoost.fn.gitVersion()
println "Build Version = ${version ?: '[none]'}"

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

repositories {
	maven { url 'https://jfrog.ford.com/artifactory/external-proxy-group/'
		credentials {
            username = System.getenv("JFROG_USERNAME")
            password = System.getenv("JFROG_PASSWORD")
		}
	}

	maven { url 'https://jfrog.ford.com/artifactory/public-maven-ford/'
		credentials {
            username = System.getenv("JFROG_USERNAME")
            password = System.getenv("JFROG_PASSWORD")
		}
	}
}

gradleBoost {
	dependencies {
		defaultRepositories = {}
	}
}

dependencies {
	// Bill Of Materials Imports
	bomImport platform('org.springframework.cloud:spring-cloud-dependencies:2023.0.5')
	bomImport platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
	bomImport platform('com.google.cloud:spring-cloud-gcp-dependencies:5.10.0')

	// Enforce Spring Boot BOM versions over transitive overrides from Ford internal libraries
	implementation enforcedPlatform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

	//Core libraries
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation ('org.springframework.boot:spring-boot-starter-webflux') {
		// Remove exclusion if dependency is required.
		// May cause FOSSA License issue if Project is not configured to exclude license scanning.
		exclude group: 'io.netty', module: 'netty-resolver-dns-native-macos'
	}
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
	implementation 'com.ford.cloudnative:spring-boot-starter-ford:5.2.0'

	//Distributed Tracing
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'com.google.cloud:spring-cloud-gcp-starter-trace'

	//spring doc
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	//security
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'com.ford.cloudnative:spring-base-security:2.1.0'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.data:spring-data-mongodb'

	//Mail configurations
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.thymeleaf:thymeleaf-spring6:3.1.5.RELEASE'
	implementation 'org.thymeleaf:thymeleaf:3.1.5.RELEASE'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	//APS
	//backward compatibility revert
	implementation 'com.ford.it.fjf:aps-spring-client:1.6.1'

	//secrets manager
	implementation 'com.google.cloud:spring-cloud-gcp-starter-secretmanager'

	//messaging
	implementation 'com.google.cloud:spring-cloud-gcp-pubsub-stream-binder'

	//cloud storage
	implementation 'com.google.cloud:google-cloud-storage'

    //Apache POI for Word document handling (DOCX) - Updated to fix CVE-2019-12415
    implementation "org.apache.poi:poi:4.0.1"
    implementation "org.apache.poi:poi-ooxml:4.0.1"
	implementation group: 'org.apache.poi', name: 'ooxml-schemas', version: '1.4'
	implementation group: 'fr.opensagres.xdocreport', name: 'fr.opensagres.poi.xwpf.converter.core', version: '2.0.2'
	implementation group: 'fr.opensagres.xdocreport', name: 'fr.opensagres.poi.xwpf.converter.pdf', version: '2.0.2'
	implementation group: 'fr.opensagres.xdocreport', name: 'fr.opensagres.xdocreport.itext.extension', version: '2.0.2'
    //iText for PDF generation - Updated to latest stable version
    implementation group: 'com.itextpdf', name: 'kernel', version: '7.1.9'
    implementation group: 'com.itextpdf', name: 'layout', version: '7.1.9'
    implementation group: 'com.itextpdf', name: 'html2pdf', version: '2.1.6'
	implementation 'com.fasterxml.jackson.module:jackson-module-parameter-names'

    //JAXB for XML Binding
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.4'

	implementation 'org.jsoup:jsoup:1.17.2'
	implementation('org.junit.jupiter:junit-jupiter-api')
	implementation('org.junit.jupiter:junit-jupiter-engine')
	implementation('org.junit.jupiter:junit-jupiter-params')
	implementation('org.junit.platform:junit-platform-launcher')
	implementation('org.junit.platform:junit-platform-runner')
	implementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}

	//other
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	///BEGIN - CVE Patches - overriding transitive dependencies to address CVE's

	///END - CVE Patches

	///BEGIN - Temporary Workarounds

	///END - Temporary Workarounds

	/*********** TEST libs ***********/
	testImplementation 'com.squareup.okhttp3:mockwebserver'
	testImplementation 'com.ford.cloudnative:spring-base-test:5.2.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'org.modelmapper:modelmapper:3.2.0'

	implementation('com.ford.it.fjf:itcore:2.71') {
		exclude group: 'org.hibernate'
	}

    //JDBC - Connect DB2
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.ibm.db2:jcc'

	//AWS SDK dependency
	implementation 'com.amazonaws:aws-java-sdk-s3:1.12.737'

	implementation("com.azure:azure-identity:1.18.2")

	//Sharepoint-Graph libraries
	implementation 'com.microsoft.graph:microsoft-graph:6.3.0'
	implementation 'com.azure:azure-identity:1.12.0'
	implementation 'com.microsoft.kiota:microsoft-kiota-http-okHttp:1.9.2'
}

tasks.withType(Test) {
	useJUnitPlatform()
}

// Increase thread stack size to prevent StackOverflowError in poi-xwpf recursive XML processing
// during large FRC Summary PDF/Excel exports
bootRun {
	jvmArgs = ['-Xss8m']
}

bootJar {
	archiveFileName = "grid-v2.jar"
	manifest {
		attributes(
				'Built-By'        : System.properties['user.name'],
				'Build-Timestamp' : new java.text.SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ").format(new Date())
		)
	}
}
